<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Campus SIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8edf4 0%, #d5dce6 100%);
            padding: 20px;
        }
        .login-box {
            background: #fff;
            padding: 50px 45px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
            width: 100%;
            max-width: 440px;
        }
        .login-box .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            color: #0b1e33;
            margin-bottom: 8px;
        }
        .login-box .logo i {
            color: #4fc3f7;
            margin-right: 10px;
        }
        .login-box .subtitle {
            text-align: center;
            font-size: 18px;
            color: #6b7a8f;
            margin-bottom: 32px;
        }
        .login-box .form-control {
            padding: 14px 18px;
            font-size: 17px;
            border-radius: 12px;
        }
        .login-box .btn {
            padding: 14px;
            font-size: 18px;
            border-radius: 12px;
        }
        .login-box .form-label {
            font-size: 16px;
            font-weight: 600;
            color: #0b1e33;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i> Campus SIS
            </div>
            <p class="subtitle">Student Information System</p>

            <form action="pages/courses.html" method="get">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" placeholder="Enter username" value="admin" required />
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="Enter password" value="password123" required />
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>
            <p class="text-center text-muted mt-3" style="font-size:14px;">Default: admin / password123</p>
        </div>
    </div>
</body>
</html>
